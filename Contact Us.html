<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Tshego's Bakery for general questions or feedback.">
    <title>Contact Us - Tshego's Bakery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Tshego's Bakery</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="About.html">About Us</a></li>
                <li><a href="Products.html">Products</a></li>
                <li><a href="Contact.html">Contact</a></li>
                <li><a href="Enquiry.html">Enquiry</a></li>
                <li><a href="Checkout.html">Checkout</a></li>
            </ul>
        </nav>
        <hr>
    </header>

    <main>
        <section class="hero">
            <h2>Contact Us</h2>
            <p>Send us a general message and we will get back to you shortly.</p>
            <hr>
        </section>

        <section class="checkout-section">
            <div class="checkout-form" style="max-width: 600px; margin: 0 auto;">
                <form action="mailto:tshego@bakery.com" method="POST" enctype="text/plain">
                    <div class="form-group">
                        <label for="contact-name">Full Name</label>
                        <input type="text" id="contact-name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="contact-email">Email Address</label>
                        <input type="email" id="contact-email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="contact-type">Type of Message</label>
                        <select id="contact-type" name="type" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
                            <option value="general">General Question</option>
                            <option value="feedback">Feedback</option>
                            <option value="complaint">Complaint</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="contact-message">Message</label>
                        <textarea id="contact-message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="cta-button">Send Message</button>
                </form>
            </div>
        </section>
        <hr>
    </main>

    <footer>
        <p>&copy; Tshego's Bakery</p>
    </footer>
</body>
</html>

<h2 style="color: #5d5037;">Custom Cake Order/ Enquiry
    <p>Fill in the form below to order a custom cake or make an enquiry.</p>
    <div style="background-color: #ffffff;padding: 20px;border: 1px;">
        <form action="#" method="post">
            <label style="color: #5d5037; font-weight: bold;">Full Name</label><br>
            <input type="text" name="name" placeholder="enter your name" required><br>

            <label style="color: #5d5037; font-weight: bold;">Email</label><br>
            <input type="email" name="email" placeholder="your@email.com" required><br>

            <label style="color: #5d5037; font-weight: bold;">Phone</label><br>
            <input type="tel" name="phone" placeholder="+27 123 456 7890" required><br>

            <label style="color: #5d5037; font-weight: bold;">Flavor</label><br>
            <input type="text" name="flavor" placeholder="vanilla/chocolate/strawberry" required><br>

            <label style="color: #5d5037; font-weight: bold;">Filling</label><br>
            <input type="text" name="filling" placeholder="strawberry/cream" required><br>

            <label style="color: #5d5037; font-weight: bold;">Size</label><br>
            <select name="size" style="width: 100%;pad: 10px;border: 1px solid #d5c4b0;">
                <option>6"</option>
                <option>8"</option>
                <option>10"</option>
            </select><br>

            <label style="color: #5d5037; font-weight: bold;">Message on Cake</label><br>
            <input type="text" name="message" placeholder="Happy Birthday" ><br>

            <label style="color: #5d5037; font-weight: bold;">Special Requests</label><br>
            <textarea name="requests" rows="4" cols="30" placeholder="any needs or extra details"><br>

            <button type="submit" style="background-color: #5d5037; color: #ffffff;border: none;padding: 8px;">Send Enquiry</button>
        </form>
    </div>
</h2>

<hr>
<footer>@Tshego's Bakery</footer>
